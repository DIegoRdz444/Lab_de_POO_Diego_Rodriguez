<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Contacto</title>

<style>

body{
font-family:Arial,sans-serif;
background:#1a1a2e;
color:#e0e0e0;
display:flex;
justify-content:center;
margin-top:60px;
}

.caja{
background:#16213e;
padding:40px;
border-radius:12px;
border:1px solid #4a90d9;
width:400px;
}

h1{
color:#f0c040;
text-align:center;
}

input{
width:100%;
padding:10px;
margin-bottom:15px;
box-sizing:border-box;
}

button{
width:100%;
padding:10px;
background:#4a90d9;
border:none;
color:white;
border-radius:6px;
}

a{
color:#4a90d9;
display:block;
margin-top:15px;
text-align:center;
}

</style>

</head>

<body>

<div class="caja">

<h1 th:text="${contacto.id} != null ?
'Editar Contacto' :
'Nuevo Contacto'">
Contacto
</h1>

<form
th:action="${contacto.id} != null ? @{/actualizar} : @{/guardar}"
th:object="${contacto}"
method="post">

<input
type="hidden"
th:field="*{id}">

<label>Nombre</label>

<input
type="text"
th:field="*{nombre}"
required>

<label>Apellido</label>

<input
type="text"
th:field="*{apellido}"
required>

<label>Email</label>

<input
type="email"
th:field="*{email}"
required>

<label>Teléfono</label>

<input
type="text"
th:field="*{telefono}">

<button type="submit">

Guardar

</button>

</form>

<a href="/contactos">

Cancelar

</a>
</div>
</body>
</html>
