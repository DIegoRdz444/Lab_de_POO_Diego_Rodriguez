<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Agenda de Contactos</title>

<style>

body{
font-family:Arial;
background:#1a1a2e;
color:white;
padding:40px;
}

table{
border-collapse:collapse;
width:100%;
margin-top:20px;
}

th,td{
border:1px solid white;
padding:10px;
}

a{
color:#4a90d9;
}

</style>

</head>
<body>

<h1>Agenda de Contactos</h1>

<a href="/nuevo">+ Nuevo contacto</a>

<p th:if="${#lists.isEmpty(contactos)}">
No hay contactos registrados.
</p>

<table th:unless="${#lists.isEmpty(contactos)}">

<tr>
<th>Nombre</th>
<th>Apellido</th>
<th>Email</th>
<th>Teléfono</th>
</tr>

<tr th:each="c : ${contactos}">
<td th:text="${c.nombre}"></td>
<td th:text="${c.apellido}"></td>
<td th:text="${c.email}"></td>
<td th:text="${c.telefono}"></td>
</tr>

</table>

</body>
</html>
