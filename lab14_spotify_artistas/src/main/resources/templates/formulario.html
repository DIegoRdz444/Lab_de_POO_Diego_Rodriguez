<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Artista Spotify</title>

<style>

body{
font-family:Arial;
background:#121212;
color:white;
display:flex;
justify-content:center;
margin-top:50px;
}

.caja{
background:#181818;
padding:40px;
border-radius:10px;
width:400px;
}

h1{
color:#1DB954;
text-align:center;
}

input{
width:100%;
padding:10px;
margin-bottom:15px;
box-sizing:border-box;
}

button{
width:100%;
padding:10px;
background:#1DB954;
color:white;
border:none;
border-radius:5px;
}

a{
display:block;
text-align:center;
margin-top:15px;
color:#1DB954;
}

</style>

</head>

<body>

<div class="caja">

<h1>Artista Spotify</h1>

<form
th:action="@{/guardar}"
th:object="${artista}"
method="post">

<input
type="hidden"
th:field="*{id}">

<label>Nombre</label>

<input
type="text"
th:field="*{nombre}"
required>

<label>Genero Musical</label>

<input
type="text"
th:field="*{genero}"
required>

<label>Pais</label>

<input
type="text"
th:field="*{pais}"
required>

<label>Oyentes Mensuales</label>

<input
type="number"
th:field="*{oyentesMensuales}"
required>

<button type="submit">

Guardar Artista

</button>

</form>

<a href="/artistas">

Volver a la lista

</a>

</div>

</body>

</html>
